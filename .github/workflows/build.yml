
name: Build FKC-U Client

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew build
          elif [ -f "./build.gradle" ] || [ -f "./build.gradle.kts" ]; then
            gradle build
          else
            echo "ERROR: No Gradle build file found in the repository root."
            exit 1
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: FKC-U-Client
          path: |
            **/build/libs/*.jar
          if-no-files-found: error
